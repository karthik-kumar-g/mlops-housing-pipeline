name: Branch-Specific CI Workflow Quant

on:
  push:
    branches:
      - dev
      - docker_ci
      - quantization

jobs:
  dev_branch_job:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.10

      - name: Install dependencies
        run: pip install scikit-learn joblib

      - name: Run training script
        run: python train.py

  docker_ci_job:
    if: github.ref == 'refs/heads/docker_ci'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.10

      - name: Install dependencies
        run: pip install scikit-learn joblib

      - name: Run training script
        run: python train.py

      - name: Build Docker image
        run: docker build -t mlops-housing-image .

      - name: Run Docker container to test model
        run: docker run --rm mlops-housing-image python predict.py

      - name: Log in to DockerHub
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USER" --password-stdin

      - name: Push Docker image
        run: |
          docker tag mlops-housing-image ${{ secrets.DOCKER_USER }}/mlops-housing-image
          docker push ${{ secrets.DOCKER_USER }}/mlops-housing-image

  quantization_job:
    if: github.ref == 'refs/heads/quantization'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.10

      - name: Install dependencies
        run: pip install torch scikit-learn joblib

      - name: Run quantization script
        run: python quantize.py
